info:
  name: 02 Request pw OTP
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/user/me/otp"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "type": "change_password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
