info:
  name: 05 Request Email OTP
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/user/me/otp"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "type": "change_email",
        "target_value": "autohacklmht@gmail.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
