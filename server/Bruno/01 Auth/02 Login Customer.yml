info:
  name: 02 Login Customer
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "identity": "lam01244410430",
        "password": "L@m07082003"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()
        const token = body?.data?.token

        if (!body?.success || !token) {
          throw new Error('Response đăng nhập không có token')
        }

        bru.setEnvVar(
          'customerToken',
          String(token),
          { persist: true }
        )

        console.log('Đã persist customerToken:', Boolean(
          bru.getEnvVar('customerToken')
        ))

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
