info:
  name: 02 Login Shop
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "identity": "customer.test01@gmail.com",
        "password": "Password@123"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: console.log('shopId:', bru.getEnvVar('shopId'))
    - type: after-response
      code: |-
        const body = res.getBody()

        if (body?.data?.user?.role !== 'shop') {
          throw new Error('Tài khoản chưa có role shop')
        }

        bru.setVar(
          'shopId',
          String(body.data.user.id)
        )

        bru.setVar(
          'shopToken',
          body.data.token
        )

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
